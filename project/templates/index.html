<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Road Traffic Forecast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>🚦 Traffic prediction System</h1>

    <div class="form">
          <label>Enter Location:</label>
    <input type="text" id="location" placeholder="Enter city or area">

        <label>Enter Date:</label>
        <input type="date" id="date">

        <label>Enter Time:</label>
        <input type="time" id="time">

        <button onclick="predictTraffic()">Predict</button>
    </div>

    <div class="result">
        <h2>Prediction Result</h2>
        <p><b>Traffic Level:</b> <span id="level">-</span></p>
        <p><b>Condition:</b> <span id="condition">-</span></p>
        <p><b>Status:</b> <span id="status">-</span></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
